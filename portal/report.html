<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__FILE__ &middot; __TAB__</title>
<style>
  :root {
    --bg:#f1f4f8; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
    --line:#e2e8f0; --line2:#eef2f7; --brand:#2563eb;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .topbar {
    position:sticky; top:0; z-index:40; background:#0d1b30; color:#fff;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding:11px 22px;
    box-shadow:0 1px 0 rgba(255,255,255,.06), 0 2px 12px rgba(13,27,48,.28);
  }
  .brand { display:flex; align-items:center; gap:12px; flex:1; min-width:260px; }
  .logo { width:34px; height:34px; border-radius:9px; background:#2563eb; color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:700; letter-spacing:.06em; }
  .topbar h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .topbar p { margin:1px 0 0; font-size:12px; color:#9fb3d1; }
  .topbar p a { color:#cfe0f7; text-decoration:none; border-bottom:1px solid rgba(207,224,247,.35); }
  .topbar p a:hover { color:#fff; border-bottom-color:#fff; }
  .actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn {
    padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08); color:#e7eefb; cursor:pointer; font:inherit;
    font-size:13.5px; font-weight:500; white-space:nowrap; text-decoration:none;
  }
  .btn:hover { background:rgba(255,255,255,.16); }

  .wrap { padding:18px 22px 60px; }
  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .bar input {
    flex:1; min-width:240px; max-width:420px; padding:8px 12px; font:inherit; font-size:13.5px;
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .bar input:focus { outline:2px solid #bfdbfe; outline-offset:-1px; border-color:var(--brand); }
  .count { font-size:12.5px; color:var(--muted); }

  .sheet { background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06); overflow:auto; max-height:calc(100vh - 190px); }
  table { border-collapse:separate; border-spacing:0; font-size:12.5px; }
  /* The heading row stays put over a long tab, and the row number stays put
     across a wide one - these tabs are 17 and 20 columns of unwrapped text. */
  th {
    position:sticky; top:0; z-index:2; background:#f8fafc; text-align:left;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td { padding:7px 12px; border-bottom:1px solid var(--line2); vertical-align:top;
    /* pre, not normal: the cells are shown as the sheet holds them, and Dicker
       pads INVOICE NUMBER with leading spaces. */
    white-space:pre; }
  tr:hover td { background:#fafcff; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  th.rn, td.rn {
    position:sticky; left:0; z-index:1; background:#fff; color:#94a3b8;
    text-align:right; font-variant-numeric:tabular-nums; font-size:11px;
    border-right:1px solid var(--line2); white-space:nowrap;
  }
  th.rn { z-index:3; background:#f8fafc; }
  tr:hover td.rn { background:#fafcff; }
  tr.off { display:none; }
  .empty { padding:56px 40px; text-align:center; color:var(--muted); font-size:13.5px;
    background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .empty strong { display:block; margin-bottom:8px; color:var(--ink); font-size:15px; font-weight:600; }
  .empty a { color:var(--brand); }
  /* Nothing to show means no filter bar and no empty grid to squint at. */
  .empty ~ .bar, .empty ~ .sheet { display:none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">CSP</span>
    <div>
      <h1>__FILE__ &middot; <span style="font-weight:400">__TAB__ tab</span></h1>
      <p>__PROVENANCE__</p>
    </div>
  </div>
  <div class="actions">
    <a class="btn" href="csp-pricing-source?sheet=__OTHER__">__OTHERNAME__ &rarr;</a>
    <a class="btn" href="csp-pricing">&larr; Back to the portal</a>
  </div>
</header>

<div class="wrap">
  __EMPTY__
  <div class="bar">
    <input id="q" type="search" placeholder="Filter rows&hellip;" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="sheet">
    <table>
      <thead>__THEAD__</thead>
      <tbody id="rows">__TBODY__</tbody>
    </table>
  </div>
</div>

<script>
var rows = Array.prototype.slice.call(document.querySelectorAll('#rows tr'));
var countEl = document.getElementById('count');
function report(n) {
  countEl.textContent = n === rows.length
    ? rows.length + (rows.length === 1 ? ' row' : ' rows')
    : n + ' of ' + rows.length + ' rows';
}
report(rows.length);
var timer;
document.getElementById('q').oninput = function () {
  var el = this;
  clearTimeout(timer);
  timer = setTimeout(function () {
    var q = el.value.trim().toLowerCase();
    var n = 0;
    rows.forEach(function (tr) {
      var hit = !q || tr.textContent.toLowerCase().indexOf(q) >= 0;
      tr.className = hit ? '' : 'off';
      if (hit) n++;
    });
    report(n);
  }, 150);
};
</script>
</body>
</html>
