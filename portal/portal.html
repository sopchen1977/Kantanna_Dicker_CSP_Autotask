<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantanna CSP Pricing Portal</title>
<style>
  :root {
    --bg:#f4f6f9; --card:#fff; --ink:#182233; --muted:#6b7686; --line:#e3e8ef;
    --brand:#0b5fff; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#10233f; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px 24px 60px; }
  .customer { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:22px; overflow:hidden; }
  .customer > .head { padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#f8fafc; }
  .customer h2 { font-size:15px; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fbfcfe; }
  tr:last-child td { border-bottom:none; }
  .num { text-align:right; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; background:var(--line); }
  .badge.synced { background:#dcfce7; color:var(--ok); }
  .badge.pending { background:#e0e7ff; color:#3730a3; }
  .badge.needs_mapping,.badge.partial { background:#fef3c7; color:var(--warn); }
  .badge.error { background:#fee2e2; color:var(--err); }
  .badge.unmapped { background:#fee2e2; color:var(--err); }
  input[type=number] { width:92px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; text-align:right; }
  input[type=number]:disabled { background:#f1f5f9; color:var(--muted); }
  input[type=text] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; width:260px; }
  input[type=date] { padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; width:135px; }
  input[type=date]:disabled { background:#f1f5f9; color:var(--muted); }
  .btn { padding:8px 16px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; font-size:13.5px; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.sync { background:#15803d; border-color:#15803d; color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  .toolbar { position:sticky; top:0; z-index:10; background:var(--bg); padding:12px 0; display:flex; gap:10px; align-items:center; }
  .toolbar .msg { color:var(--muted); font-size:13px; }
  .map-box { position:relative; }
  .map-results { position:absolute; top:100%; left:0; width:320px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.12); z-index:20; max-height:240px; overflow:auto; }
  .map-results div { padding:7px 10px; cursor:pointer; font-size:13px; }
  .map-results div:hover { background:#eef2f7; }
  .margin-pos { color:var(--ok); }
  .margin-neg { color:var(--err); }
  .muted { color:var(--muted); }
  .small { font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>Kantanna &middot; Dicker CSP &rarr; Autotask Pricing Portal</h1>
  <span id="meta" class="small" style="color:#cdd9ee"></span>
</header>
<div class="wrap">
  <div class="toolbar">
    <button class="btn primary" onclick="saveAll(this)">Save prices</button>
    <button class="btn sync" onclick="syncNow(this)">Sync to Autotask</button>
    <button class="btn" onclick="location.reload()">Refresh</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="app"></div>
</div>

<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
var BASE = location.pathname.replace(/\/csp-pricing.*$/, '');
var DATA = JSON.parse(atob(document.getElementById('__data').textContent));
var LINES = DATA.lines || [];
var MAPPINGS = {};
(DATA.mappings || []).forEach(function (m) { MAPPINGS[(m.tenant_name || '').toLowerCase()] = m; });

function fmt(n) { return (Number(n) || 0).toFixed(2); }
function periodRrp(l) { return Number(l.period_rrp !== null && l.period_rrp !== undefined ? l.period_rrp : l.monthly_rrp) || 0; }
function periodCost(l) { return Number(l.period_cost !== null && l.period_cost !== undefined ? l.period_cost : l.monthly_cost) || 0; }
function periodSuffix(l) { return l.billing_months === 12 ? '/yr' : '/mo'; }
function billingLabel(l) {
  if (l.billing_type === 'annual_upfront') return 'Annual · Upfront';
  if (l.billing_type === 'annual_monthly') return 'Annual · Monthly';
  if (l.billing_type === 'usage') return 'Usage';
  return 'Month to Month';
}
function effSell(l) {
  return (l.use_custom_price && l.sell_price !== null && l.sell_price !== undefined && l.sell_price !== '')
    ? Number(l.sell_price) : periodRrp(l);
}
function effInclude(l) {
  if (l.include === false) return false;
  if (l.include === true) return true;
  return l.charge_type === 'NCE' && l.status === 'Active' && periodRrp(l) > 0;
}
function marginPct(l) {
  var s = effSell(l), c = periodCost(l);
  if (!s) return null;
  return ((s - c) / s) * 100;
}

function render() {
  var byCustomer = {};
  LINES.forEach(function (l) { (byCustomer[l.tenant_name] = byCustomer[l.tenant_name] || []).push(l); });
  var names = Object.keys(byCustomer).sort();
  var app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('meta').textContent = LINES.length + ' subscription lines · ' +
    names.length + ' customers' + (LINES[0] && LINES[0].imported_at ? ' · imported ' + String(LINES[0].imported_at).slice(0, 10) : '');

  if (!names.length) {
    app.innerHTML = '<p class="muted">No subscription lines yet. Run the "01 · Annuity Import" workflow form first.</p>';
    return;
  }

  names.forEach(function (name) {
    var mapping = MAPPINGS[name.toLowerCase()];
    var card = document.createElement('div');
    card.className = 'customer';

    var head = document.createElement('div');
    head.className = 'head';
    var h2 = document.createElement('h2');
    h2.textContent = name;
    head.appendChild(h2);

    if (mapping) {
      var ok = document.createElement('span');
      ok.className = 'badge synced';
      ok.textContent = 'Autotask: ' + mapping.autotask_company_name + ' (#' + mapping.autotask_company_id + ')';
      head.appendChild(ok);
    } else {
      var bad = document.createElement('span');
      bad.className = 'badge unmapped';
      bad.textContent = 'not mapped';
      head.appendChild(bad);
      head.appendChild(buildMapper(name));
    }
    card.appendChild(head);

    var table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Incl.</th><th>Offer</th><th>Billing</th><th>Subscription ID</th>' +
      '<th class="num">Qty</th><th class="num">Cost</th><th class="num">RRP</th>' +
      '<th>Custom</th><th class="num">Sell</th><th title="Date the price change takes effect in Autotask">From</th><th class="num">Margin</th><th>Status</th></tr></thead>';
    var tbody = document.createElement('tbody');
    byCustomer[name].forEach(function (l) { tbody.appendChild(buildRow(l)); });
    table.appendChild(tbody);
    card.appendChild(table);
    app.appendChild(card);
  });
}

function buildRow(l) {
  var tr = document.createElement('tr');

  var incl = document.createElement('input');
  incl.type = 'checkbox';
  incl.checked = effInclude(l);
  incl.onchange = function () { l.include = incl.checked; l._dirty = true; };
  tr.appendChild(td(incl));

  var offer = document.createElement('td');
  offer.innerHTML = escapeHtml(l.offer_name || '') +
    ' <span class="mono">' + escapeHtml(l.sku || '') + '</span>';
  tr.appendChild(offer);

  var billing = document.createElement('td');
  billing.innerHTML = '<span class="badge">' + escapeHtml(billingLabel(l)) + '</span>';
  tr.appendChild(billing);

  var sid = document.createElement('td');
  sid.innerHTML = '<span class="mono" title="' + escapeHtml(l.subscription_id) + '">' + escapeHtml(String(l.subscription_id).slice(0, 8)) + '…</span>';
  tr.appendChild(sid);

  tr.appendChild(tdText(l.qty, 'num'));
  tr.appendChild(tdText(fmt(periodCost(l)) + periodSuffix(l), 'num'));
  tr.appendChild(tdText(fmt(periodRrp(l)) + periodSuffix(l), 'num'));

  var custom = document.createElement('input');
  custom.type = 'checkbox';
  custom.checked = !!l.use_custom_price;
  tr.appendChild(td(custom));

  var sell = document.createElement('input');
  sell.type = 'number'; sell.step = '0.01'; sell.min = '0';
  sell.value = fmt(effSell(l));
  sell.disabled = !l.use_custom_price;
  sell.title = 'Sell price per billing period (' + periodSuffix(l).slice(1) + ')';
  tr.appendChild(td(sell, 'num'));

  var effDate = document.createElement('input');
  effDate.type = 'date';
  effDate.value = /^\d{4}-\d{2}-\d{2}$/.test(l.price_effective_date || '') ? l.price_effective_date : new Date().toISOString().slice(0, 10);
  effDate.title = 'Price/unit changes take effect in Autotask from this date';
  effDate.onchange = function () { l.price_effective_date = effDate.value; l._dirty = true; };
  l.price_effective_date = effDate.value;
  tr.appendChild(td(effDate));

  var margin = document.createElement('td');
  margin.className = 'num';
  tr.appendChild(margin);

  function refreshMargin() {
    var m = marginPct(l);
    margin.innerHTML = m === null ? '<span class="muted">—</span>'
      : '<span class="' + (m >= 0 ? 'margin-pos' : 'margin-neg') + '">' + m.toFixed(1) + '%</span>';
  }
  refreshMargin();

  custom.onchange = function () {
    l.use_custom_price = custom.checked; l._dirty = true;
    if (!custom.checked) { l.sell_price = null; sell.value = fmt(periodRrp(l)); sell.disabled = true; }
    else { sell.disabled = false; l.sell_price = Number(sell.value); sell.focus(); }
    refreshMargin();
  };
  sell.onchange = function () { l.sell_price = Number(sell.value); l._dirty = true; refreshMargin(); };

  var status = document.createElement('td');
  var badge = '<span class="badge ' + escapeHtml(l.sync_status || 'pending') + '">' + escapeHtml(l.sync_status || 'pending') + '</span>';
  var extra = '';
  if (l.autotask_contract_id) extra += '<div class="mono small">Contract #' + l.autotask_contract_id + '</div>';
  if (l.sync_message) extra += '<div class="muted small">' + escapeHtml(String(l.sync_message).slice(0, 120)) + '</div>';
  status.innerHTML = badge + extra;
  tr.appendChild(status);

  return tr;
}

function buildMapper(tenantName) {
  var box = document.createElement('span');
  box.className = 'map-box';
  var input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search Autotask companies…';
  var results = document.createElement('div');
  results.className = 'map-results';
  results.style.display = 'none';
  box.appendChild(input); box.appendChild(results);

  var timer;
  input.oninput = function () {
    clearTimeout(timer);
    var q = input.value.trim();
    if (q.length < 2) { results.style.display = 'none'; return; }
    timer = setTimeout(function () {
      fetch(BASE + '/csp-pricing-companies?q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (list) {
          results.innerHTML = '';
          (list.companies || []).forEach(function (c) {
            var el = document.createElement('div');
            el.textContent = c.name + ' (#' + c.id + ')';
            el.onclick = function () { saveMapping(tenantName, c); };
            results.appendChild(el);
          });
          if (!(list.companies || []).length) results.innerHTML = '<div class="muted">No matches</div>';
          results.style.display = 'block';
        })
        .catch(function (e) { results.innerHTML = '<div class="muted">' + escapeHtml(e.message) + '</div>'; results.style.display = 'block'; });
    }, 350);
  };
  return box;
}

function saveMapping(tenantName, company) {
  fetch(BASE + '/csp-pricing-mapping', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_name: tenantName, autotask_company_id: company.id, autotask_company_name: company.name })
  }).then(function () { location.reload(); });
}

function saveAll(btn) {
  btn.disabled = true;
  var payload = LINES.map(function (l) {
    return {
      subscription_id: l.subscription_id, stock_code: l.stock_code,
      use_custom_price: !!l.use_custom_price,
      sell_price: l.use_custom_price ? Number(l.sell_price !== null && l.sell_price !== undefined ? l.sell_price : periodRrp(l)) : null,
      include: effInclude(l),
      price_effective_date: l.price_effective_date || ''
    };
  });
  fetch(BASE + '/csp-pricing-save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines: payload })
  }).then(function (r) { return r.json(); })
    .then(function (res) { setMsg('Saved ' + (res.updated || 0) + ' lines.'); btn.disabled = false; })
    .catch(function (e) { setMsg('Save failed: ' + e.message); btn.disabled = false; });
}

function syncNow(btn) {
  if (!confirm('Save prices first if you changed anything.\n\nPush included lines to Autotask now? Contracts and services will be created/updated.')) return;
  btn.disabled = true;
  fetch(BASE + '/csp-autotask-sync', { method: 'POST' })
    .then(function () { setMsg('Sync started. Refresh in a minute to see per-line results.'); btn.disabled = false; })
    .catch(function (e) { setMsg('Could not start sync: ' + e.message); btn.disabled = false; });
}

function setMsg(t) { document.getElementById('msg').textContent = t; }
function td(child, cls) { var c = document.createElement('td'); if (cls) c.className = cls; c.appendChild(child); return c; }
function tdText(t, cls) { var c = document.createElement('td'); if (cls) c.className = cls; c.textContent = t; return c; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

render();
</script>
</body>
</html>
