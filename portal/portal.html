<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantanna CSP Pricing Portal</title>
<style>
  :root {
    --bg:#f1f4f8; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
    --line:#e2e8f0; --line2:#eef2f7;
    --brand:#2563eb; --ok:#047857; --okbg:#ecfdf5; --warn:#b45309; --warnbg:#fffbeb;
    --err:#b91c1c; --errbg:#fef2f2; --violet:#6d28d9; --violetbg:#f5f3ff;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .num, td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .muted { color:var(--muted); }

  /* ---------- top bar ---------- */
  .topbar {
    position:sticky; top:0; z-index:40; background:#0d1b30; color:#fff;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    padding:11px 26px; box-shadow:0 1px 0 rgba(255,255,255,.06), 0 2px 12px rgba(13,27,48,.28);
  }
  .brand { display:flex; align-items:center; gap:12px; flex:1; min-width:260px; }
  .logo {
    width:34px; height:34px; border-radius:9px; background:#2563eb; color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:700; letter-spacing:.06em;
  }
  .topbar h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .topbar p { margin:1px 0 0; font-size:12px; color:#9fb3d1; }
  .actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .actions .msg { font-size:12.5px; color:#a9c4ea; max-width:340px; }

  .btn {
    padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#fff;
    color:var(--ink); cursor:pointer; font:inherit; font-size:13.5px; font-weight:500;
    white-space:nowrap; transition:filter .12s, background .12s;
  }
  .btn:hover:not(:disabled) { filter:brightness(.97); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.go { background:#047857; border-color:#047857; color:#fff; }
  .btn.ghost { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.22); color:#e7eefb; text-decoration:none; }
  .btn.tiny { padding:4px 10px; font-size:12px; }
  .btn.link { border:none; background:none; padding:0; color:var(--brand); font-size:12px; }
  .btn.link:hover { text-decoration:underline; }

  .wrap { max-width:1240px; margin:0 auto; padding:22px 26px 80px; }

  /* ---------- stats ---------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 15px; box-shadow:var(--shadow); }
  .stat .k { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .stat .v { font-size:22px; font-weight:650; letter-spacing:-.02em; margin-top:3px; }
  .stat .s { font-size:12px; color:var(--muted); margin-top:1px; }
  .stat.due .v { color:var(--warn); }
  .stat.attn .v { color:var(--err); }
  .stat.clear .v { color:var(--ok); }

  /* ---------- filter bar ---------- */
  .filterbar {
    position:sticky; top:57px; z-index:30; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--bg); padding:10px 0 12px; margin-bottom:2px;
    box-shadow:0 12px 12px -12px rgba(15,23,42,.10);
  }
  .filterbar input[type=search] {
    flex:1; min-width:220px; max-width:400px; padding:8px 12px; font:inherit; font-size:13.5px;
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .filterbar input[type=search]:focus { outline:2px solid #bfdbfe; outline-offset:-1px; border-color:var(--brand); }
  .chk { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); cursor:pointer; user-select:none; }
  .spacer { flex:1; }

  /* ---------- customer ---------- */
  .customer { background:var(--card); border:1px solid var(--line); border-radius:13px; margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden; }
  .chead-cust {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .chead-cust:hover { background:#fafbfd; }
  .chead-cust h2 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em; }
  .custsum { margin-left:auto; display:flex; align-items:center; gap:16px; font-size:12.5px; color:var(--muted); }
  .custsum b { color:var(--ink); font-weight:600; }
  .caret { width:16px; color:var(--muted); font-size:11px; transition:transform .15s; flex:none; }
  .collapsed > .caret, .collapsed .caret { transform:rotate(-90deg); }
  .customer.collapsed .cbody { display:none; }
  .contract.collapsed .tablewrap { display:none; }

  /* ---------- contract ---------- */
  .contract { border-top:1px solid var(--line2); }
  .contract:first-child { border-top:none; }
  .chead {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 18px;
    background:#f8fafc; cursor:pointer;
  }
  .chead:hover { background:#f1f5f9; }
  .ctitle { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; min-width:0; }
  .cpre { font-size:10.5px; font-weight:700; letter-spacing:.08em; color:#94a3b8; }
  .cname { font-size:13.5px; font-weight:650; letter-spacing:-.01em; }
  .cdates { font-size:12.5px; color:var(--muted); }
  .cmeta { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .cmeta .cval { color:var(--ink); font-weight:600; }
  .contract.usage .chead { background:#fbfcfd; }
  .contract.usage .cname { color:var(--muted); font-weight:500; }

  .atlink { color:var(--brand); text-decoration:none; font-weight:600; font-size:12.5px; white-space:nowrap; }
  .atlink:hover { text-decoration:underline; }

  /* ---------- table ---------- */
  /* Every table shares one fixed column grid so the numbers line up all
     the way down the page, across contracts and customers. */
  .cbody { overflow-x:auto; }
  .cinner { min-width:1068px; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  th {
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    text-align:left; padding:9px 12px 8px; background:#fff; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th[title] { cursor:help; text-decoration:underline dotted #cbd5e1; text-underline-offset:3px; }
  .colhead { background:#fff; border-bottom:1px solid var(--line); }
  .colhead table { border-collapse:collapse; }
  .colhead th { border-bottom:none; }
  td { padding:11px 12px; border-bottom:1px solid var(--line2); vertical-align:top; font-size:13.5px; }
  tr.line:last-child td, tr.detail:last-child td { border-bottom:none; }
  tr.line:hover td { background:#fafcff; }
  tr.line.off td { opacity:.5; }
  tr.line.off:hover td { opacity:.75; }
  td.pick { width:34px; padding-left:18px; padding-right:0; }
  td.pick input { width:15px; height:15px; accent-color:var(--brand); cursor:pointer; }

  .svc { font-weight:550; letter-spacing:-.005em; line-height:1.3; }
  .svcsub { font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .dot { color:#cbd5e1; }

  .badge {
    display:inline-block; padding:1.5px 8px; border-radius:99px; font-size:11px; font-weight:600;
    background:#eef2f7; color:var(--ink2); white-space:nowrap; line-height:1.5;
  }
  .badge.b-annual_monthly { background:#eff6ff; color:#1d4ed8; }
  .badge.b-annual_upfront { background:#eef2ff; color:#4338ca; }
  .badge.b-monthly { background:#f0fdfa; color:#0f766e; }
  .badge.b-usage { background:#f1f5f9; color:var(--muted); }
  .badge.coterm { background:var(--violetbg); color:var(--violet); cursor:help; }
  .badge.synced { background:var(--okbg); color:var(--ok); }
  .badge.pending { background:#eef2ff; color:#4338ca; }
  .badge.needs_mapping, .badge.partial { background:var(--warnbg); color:var(--warn); }
  .badge.error, .badge.unmapped { background:var(--errbg); color:var(--err); }
  .badge.mapped { background:var(--okbg); color:var(--ok); }

  .rate { font-weight:600; }
  .per { font-size:11px; color:var(--muted); font-weight:400; }
  /* Margin is neutral when healthy so the exceptions are the only thing
     that catches the eye. */
  .marg { color:var(--ink2); }
  .marg.thin { color:var(--warn); font-weight:650; }
  .marg.neg { color:var(--err); font-weight:650; }
  .ok-tick { color:#94a3b8; font-size:13px; cursor:help; }

  /* ---------- sell cell ---------- */
  td.sell { white-space:nowrap; }
  .sellview { display:flex; align-items:center; justify-content:flex-end; }
  .sellview .amt {
    font:inherit; font-weight:650; font-variant-numeric:tabular-nums; border:none; background:none;
    padding:0; cursor:pointer; color:var(--ink); border-bottom:1px dashed transparent; line-height:1.3;
  }
  .sellview .amt:hover { color:var(--brand); border-bottom-color:#93c5fd; }
  .sellview .amt.custom { color:var(--brand); }
  .editing .sellview { display:none; }
  .selledit { display:none; }
  .editing .selledit { display:block; }
  .selledit input[type=number] {
    width:100%; max-width:120px; padding:5px 7px; border:1px solid var(--brand); border-radius:7px; font:inherit;
    font-size:13.5px; text-align:right; font-variant-numeric:tabular-nums;
  }
  .selledit input[type=date] { width:100%; max-width:140px; padding:4px 6px; border:1px solid var(--line); border-radius:7px; font:inherit; font-size:12px; margin-top:5px; }
  .fromlbl { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:6px; }
  .picks { font-size:11px; margin-top:3px; white-space:nowrap; }
  .picks a { color:var(--brand); cursor:pointer; text-decoration:none; }
  .picks a:hover { text-decoration:underline; }

  /* ---------- invoice description ---------- */
  .inv { margin-top:5px; font-size:11.5px; display:flex; align-items:baseline; gap:6px; min-width:0; }
  .inv .lbl { color:#94a3b8; font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:10px; flex:none; }
  /* One line, ellipsised - the full text is in the tooltip and in the
     editor, so a long description never changes the row height. */
  .invtext {
    font:inherit; font-size:11.5px; text-align:left; border:none; background:none; padding:0; cursor:pointer;
    color:var(--ink2); border-bottom:1px dashed transparent; line-height:1.35;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .invtext:hover { color:var(--brand); border-bottom-color:#93c5fd; }
  .invtext.custom { color:var(--brand); font-weight:600; }
  .invtext.default { color:#94a3b8; font-style:italic; }
  .invedit { display:none; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .inv-open .invedit { display:flex; }
  .inv-open .inv { display:none; }
  .invedit input[type=text] {
    flex:1; min-width:220px; max-width:440px; padding:5px 8px; font:inherit; font-size:12.5px;
    border:1px solid var(--brand); border-radius:7px;
  }
  .invedit .count { font-size:10.5px; color:var(--muted); }

  /* ---------- billing pill + detail ---------- */
  .pill {
    display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 8px; border-radius:8px;
    font-size:12.5px; font-weight:600; border:1px solid transparent; cursor:pointer; background:none;
    font-family:inherit; color:inherit; white-space:nowrap;
  }
  .pill .tick { font-size:9px; opacity:.85; }
  .pill.due { background:var(--warnbg); border-color:#fde68a; color:var(--warn); }
  .pill.clear { background:var(--okbg); border-color:#a7f3d0; color:var(--ok); }
  .pill.none { background:#f8fafc; border-color:var(--line); color:var(--muted); font-weight:500; cursor:default; }
  .pill.due:hover, .pill.clear:hover { filter:brightness(.97); }
  .pill .n { font-weight:500; opacity:.85; font-size:11.5px; }
  .billcell { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .itag {
    display:inline-flex; align-items:center; padding:2px 7px; border-radius:6px; white-space:nowrap;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid transparent; cursor:default;
  }
  .itag.yes { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
  .itag.no { background:#f8fafc; border-color:var(--line); color:var(--muted); font-weight:600; }
  .itag.wait { background:var(--warnbg); border-color:#fde68a; color:var(--warn); }

  /* The Approve & Post date range. Warm like the pill it sits beside, because
     it is part of the same "you have something to post" story - and labelled,
     so it is never mistaken for the contract term printed alongside it. */
  .range {
    display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:6px;
    font-size:11.5px; font-weight:600; white-space:nowrap; cursor:help;
    background:var(--warnbg); border:1px solid #fde68a; color:var(--warn);
    font-variant-numeric:tabular-nums;
  }
  .range .rlbl { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.72; }

  /* Most lines repeat last cycle, so "unchanged" is plain muted text and only
     the exceptions carry a chip - the same reason the margin column is neutral
     when it is healthy. */
  .chg {
    display:inline-flex; align-items:center; padding:2px 7px; border-radius:6px; white-space:nowrap;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid transparent; cursor:help;
  }
  .chg.new { background:#eef2ff; border-color:#c7d2fe; color:#4338ca; }
  .chg.prorata { background:var(--violetbg); border-color:#ddd6fe; color:var(--violet); }
  .chg.qty { background:var(--warnbg); border-color:#fde68a; color:var(--warn); }
  .chg.same, .chg.none { font-size:11.5px; font-weight:400; text-transform:none; letter-spacing:0;
    padding:0; color:var(--muted); }

  tr.detail { display:none; }
  tr.detail.open { display:table-row; }
  tr.detail td { padding:0 12px 13px 46px; border-bottom:1px solid var(--line2); background:#fcfdfe; }
  .dpanel { border-left:2px solid var(--line); padding:2px 0 2px 14px; }
  .dline { display:flex; align-items:baseline; gap:10px; font-size:12.5px; padding:3px 0; flex-wrap:wrap; }
  .dline .when { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--ink2); min-width:186px; }
  .dline .amt { font-weight:600; margin-left:auto; }
  .dtag { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; padding:1px 6px; border-radius:5px; background:#eef2f7; color:var(--muted); }
  .dtag.cycle { background:#eff6ff; color:#1d4ed8; }
  .dtag.prorata { background:var(--violetbg); color:var(--violet); }
  .dfoot { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .dsec { font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:#94a3b8; margin:9px 0 3px; }
  .dsec:first-child { margin-top:0; }
  .dline.posted .amt { color:var(--ok); }
  .dnone { font-size:12.5px; color:var(--muted); padding:3px 0; }
  .inv-no { font-weight:600; color:var(--ink2); }

  /* ---------- mapper ---------- */
  .map-box { position:relative; }
  .map-box input { padding:6px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13px; width:250px; }
  .map-results { position:absolute; top:calc(100% + 4px); left:0; width:320px; background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 8px 24px rgba(15,23,42,.14); z-index:20; max-height:250px; overflow:auto; }
  .map-results div { padding:8px 11px; cursor:pointer; font-size:13px; }
  .map-results div:hover { background:#eff6ff; }

  .empty { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:40px; text-align:center; color:var(--muted); }
  @media (max-width:860px) {
    .wrap { padding:16px 14px 60px; }
    .custsum, .cmeta { margin-left:0; width:100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">CSP</span>
    <div>
      <h1>Dicker Data &rarr; Autotask pricing</h1>
      <p id="meta"></p>
    </div>
  </div>
  <div class="actions">
    <span class="msg" id="msg"></span>
    <a class="btn ghost" href="https://ww31.autotask.net/" target="_blank" rel="noopener"
       title="Approve &amp; Post lives under Contracts &gt; Approve &amp; Post">Autotask &#8599;</a>
    <button class="btn ghost" onclick="location.reload()">Refresh</button>
    <button class="btn primary" onclick="saveAll(this)">Save prices</button>
    <button class="btn go" onclick="syncNow(this)">Sync to Autotask</button>
  </div>
</header>

<div class="wrap">
  <section class="stats" id="stats"></section>
  <div class="filterbar">
    <input id="q" type="search" placeholder="Filter by customer, product or SKU…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="onlyDue"> Awaiting posting only</label>
    <label class="chk"><input type="checkbox" id="onlyOff"> Include excluded lines</label>
    <span class="spacer"></span>
    <button class="btn tiny" onclick="setAll(true)">Expand all</button>
    <button class="btn tiny" onclick="setAll(false)">Collapse all</button>
  </div>
  <div id="app"></div>
</div>

<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
var BASE = location.pathname.replace(/\/csp-pricing.*$/, '');
// Where the invoice numbers in the "Last approved & posted" drawer point.
// Autotask's ExecuteCommand API has documented codes for opening a contract,
// a ticket, a quote and half a dozen other things, but none for an invoice -
// so this address is NOT from the API docs. It is what Autotask itself puts in
// the address bar with an invoice open, which makes it undocumented and liable
// to change under us. {id} is the invoice's INTERNAL id (7807), not the number
// the customer sees on the invoice (4339); {number} is available too. Blank
// this and the numbers render as plain text again, which is the whole
// fallback: nothing guessed, nothing to break.
var INVOICE_URL = 'https://ww31.autotask.net/Mvc/Contracts/InvoiceViewer.mvc?invoiceId={id}';
var DATA = JSON.parse(atob(document.getElementById('__data').textContent));
var LINES = DATA.lines || [];
var MAPPINGS = {};
(DATA.mappings || []).forEach(function (m) { MAPPINGS[(m.tenant_name || '').toLowerCase()] = m; });

/* ============================================================
   Pricing / term maths. Unchanged from the previous portal —
   these mirror the sync (Prepare Lines) exactly.
   ============================================================ */
function fmt(n) { return (Number(n) || 0).toFixed(2); }
function money(n) {
  return '$' + (Number(n) || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function money0(n) {
  return '$' + Math.round(Number(n) || 0).toLocaleString('en-AU');
}
function fullPeriodRrp(l) { return Number(l.period_rrp !== null && l.period_rrp !== undefined ? l.period_rrp : l.monthly_rrp) || 0; }
function fullPeriodCost(l) { return Number(l.period_cost !== null && l.period_cost !== undefined ? l.period_cost : l.monthly_cost) || 0; }
// Co-terming: Microsoft aligns a new annual subscription to an existing
// anniversary, so its CURRENT term is shorter than 12 months while Dicker
// still lists the full 12-month unit price. Billed monthly that changes
// nothing (the monthly rate is the monthly rate, there are just fewer of
// them); billed annually UPFRONT the single charge is pro-rated on days,
// exactly as Dicker invoices it.
function cotermInfo(l) {
  var w = contractWindow(l);
  var months = Number(l.term_months) || 12;
  if (months !== 12 || !w.start || !w.end) return { days: 0, factor: 1, coterm: false };
  var a = new Date(w.start + 'T00:00:00Z'), b = new Date(w.end + 'T00:00:00Z');
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return { days: 0, factor: 1, coterm: false };
  var days = Math.round((b - a) / 86400000) + 1;
  if (days <= 0) return { days: 0, factor: 1, coterm: false };
  var factor = Math.min(Math.round((days / 365) * 10000) / 10000, 1);
  return { days: days, factor: factor, coterm: factor < 0.99 };
}
function termScale(l) {
  var ci = cotermInfo(l);
  return ci.coterm && l.billing_type === 'annual_upfront' ? ci.factor : 1;
}
function periodRrp(l) { return Math.round(fullPeriodRrp(l) * termScale(l) * 100) / 100; }
function periodCost(l) { return Math.round(fullPeriodCost(l) * termScale(l) * 100) / 100; }
function periodSuffix(l) { return l.billing_months === 12 ? '/yr' : '/mo'; }
function billingLabel(l) {
  if (l.billing_type === 'annual_upfront') return 'Annual · upfront';
  if (l.billing_type === 'annual_monthly') return 'Annual · monthly';
  if (l.billing_type === 'usage') return 'Usage';
  return 'Month to month';
}
// The line's CURRENT contract price (read back from Autotask on the last
// sync); RRP only as the default for lines with no contract service yet.
function currentPrice(l) {

function render() {

  var byCustomer = {};

function renderStats(visible) {
  var due = 0, monthly = 0, attn = 0, incl = 0;
  var contracts = {}, custs = {}, span = { first: '', last: '' };
  visible.forEach(function (l) {
    custs[l.tenant_name] = 1;
    var g = groupContract(l);
    if (g.name) contracts[l.tenant_name + '|' + g.name] = 1;
    if (effInclude(l)) { incl++; monthly += monthlyValue(l); }
    due += dueNow(l);
    widenSpan(span, pendingSpan(l));

    { k: 'Customers', v: Object.keys(custs).length, s: Object.keys(contracts).length + ' Autotask contracts' },
    { k: 'Services billing', v: incl, s: visible.length - incl + ' excluded' },
    { k: 'Monthly recurring', v: money0(monthly), s: 'at current sell prices' },
    // The date range replaces "sitting in Autotask now": knowing it is there
    // is one glance, and the next thing you need is the range to type in.

      : '<span class="badge unmapped">not mapped to Autotask</span>' + mapperHtml(name)) +
    '<div class="custsum">' +
      '<span>' + order.length + (order.length === 1 ? ' contract' : ' contracts') + '</span>' +
      '<span><b>' + money0(monthly) + '</b> /mo</span>' +
      (due > 0 ? '<span style="color:var(--warn)"><b style="color:var(--warn)">' + money(due) + '</b> awaiting</span>' : '') +
      rangeHtml(span, 'this customer') +
    '</div>' +
  '</div>';

  return '<section class="customer' + (closed ? ' collapsed' : '') + '">' + head +
    '<div class="cbody"><div class="cinner">' + COLHEAD + order.map(function (cn) {
      return contractHtml(name, cn, byContract[cn]);
    }).join('') + '</div></div></section>';
}

function contractHtml(customer, cname, block) {
  var lines = block.lines.slice().sort(function (a, b) {
    return productName(a).localeCompare(productName(b));
  });
  var key = 'k:' + customer + '|' + cname;
  var closed = !!UI.closed[key];

  var due = 0, monthly = 0, checked = false, pend = 0, posted = 0, invoiced = 0, notApproved = 0;
  var chg = { new: 0, prorata: 0, qty: 0, same: 0, none: 0 }, classified = 0;
  var span = { first: '', last: '' };
  lines.forEach(function (l) {
    if (effInclude(l)) monthly += monthlyValue(l);
    if (effInclude(l) && l.billing_last) checked = true;
    due += dueNow(l);
    widenSpan(span, pendingSpan(l));
    pend += pendingCount(l);
    if (effInclude(l) && pendingCount(l) > 0) notApproved++;
    if (effInclude(l) && pendingCount(l) === 0 && lastPostedIso(l)) {
      posted++;
      if (isInvoiced(l)) invoiced++;
    }
    var c = cycleChange(l);
    if (c) { chg[c.kind]++; classified++; }
  });
  // What this import did to the contract as a whole. Only the exceptions are
  // named; a contract that simply repeats last cycle says so in one word,
  // because that is the answer that needs no follow-up.
  var chgParts = [];
  // Nothing on this contract has ever billed, so the contract itself is new -
  // the sync created it on this run rather than adding to something standing.
  if (chg.new) chgParts.push(chg.new === classified ? 'new contract' : chg.new + ' new');
  if (chg.prorata) chgParts.push(chg.prorata + ' pro-rata');
  if (chg.qty) chgParts.push(chg.qty + ' qty change' + (chg.qty > 1 ? 's' : ''));
  var chgTag = '';
  if (chgParts.length) {
    chgTag = '<span class="chg ' + (chg.new ? 'new' : (chg.prorata ? 'prorata' : 'qty')) +
      '" title="What this month&#39;s report changes on this contract">' +
      escapeHtml(chgParts.join(' · ')) + '</span>';
  } else if (chg.same) {
    chgTag = '<span class="chg same" title="Every service on this contract bills the same as last cycle">' +
      'unchanged</span>';
  }
  // The same lifecycle, rolled up. Anything waiting to be approved is the
  // headline - it is the only one of the three that asks something of you -
  // and the invoiced split is what is left to say once nothing is waiting.
  var invTag = '';
  if (notApproved > 0) {
    invTag = '<span class="itag wait" title="' + attr(notApproved + ' of ' + lines.length +
      ' services have charges sitting in Approve & Post') + '">' +
      notApproved + ' not approved</span>';
  } else if (posted > 0) {
    invTag = invoiced === posted
      ? '<span class="itag yes" title="Every posted charge on this contract is on a customer invoice">all invoiced</span>'
      : '<span class="itag no" title="' + attr(String(posted - invoiced) + ' of ' + posted +
          ' posted services are not on a customer invoice yet') + '">' +
        (posted - invoiced) + ' not invoiced</span>';
  }
  var atId = (lines.filter(function (l) { return l.autotask_contract_id; })[0] || {}).autotask_contract_id;

  var title, meta;
  if (!cname) {
    title = '<div class="ctitle"><span class="cname">Not billed through Autotask</span>' +
      '<span class="cdates">usage-billed &mdash; excluded from the sync</span></div>';
    meta = '<div class="cmeta"><span>' + lines.length + (lines.length === 1 ? ' line' : ' lines') + '</span></div>';
  } else {
    title = '<div class="ctitle" title="' + attr(cname) + '">' +
      '<span class="cpre">CSP MICROSOFT</span>' +
      '<span class="cname">' + escapeHtml(block.grp.kind || '') + '</span>' +
      '<span class="cdates">' + escapeHtml(block.grp.label || '') + '</span></div>';
    meta = '<div class="cmeta">' +
      '<span>' + lines.length + (lines.length === 1 ? ' service' : ' services') + '</span>' +
      '<span><span class="cval">' + money0(monthly) + '</span> /mo</span>' +
      (checked
        ? (pend > 0
          ? '<span class="pill due" style="cursor:default" title="' + attr(rangeHint('this contract', span)) +
            '"><span class="tick">&#9679;</span>' + money(due) + ' to post' +
            (spanLabel(span) ? ' <span class="n">' + escapeHtml(spanLabel(span)) + '</span>' : '') + '</span>'
          : (posted
            ? '<span class="pill clear" style="cursor:default"><span class="tick">&#10003;</span>all posted</span>'
            : '<span class="pill none" style="cursor:default">nothing to bill</span>'))
        : '') +
      chgTag +
      invTag +
      (atId ? contractLink(atId) : '') +
    '</div>';
  }

  var rows = lines.map(lineHtml).join('');

  return '<div class="contract' + (cname ? '' : ' usage') + (closed ? ' collapsed' : '') + '">' +
    '<div class="chead js-toggle" data-key="' + attr(key) + '">' +
      '<span class="caret">&#9660;</span>' + title + meta +
    '</div>' +
    '<div class="tablewrap"><table>' + COLS + '<tbody>' + rows + '</tbody></table></div></div>';
}

function lineHtml(l) {
  var i = l._i;
  var on = effInclude(l);
  var win = contractWindow(l);
  var ci = cotermInfo(l);
  var suffix = periodSuffix(l);
  var m = marginPct(l);

  // Sub-line: billing type, and the term only when this line's own window
  // differs from the contract it sits on (co-terms). Most rows have neither,
  // and the sub-line is dropped entirely rather than left as an empty gap.
  var bits = [];
  // The billing type is already the contract's name, so it is only worth
  // repeating on the lines that sit outside a contract (usage-billed).
  if (!groupContract(l).name) {
    bits.push('<span class="badge b-' + escapeHtml(l.billing_type || 'monthly') + '">' +
      escapeHtml(billingLabel(l)) + '</span>');
  }
  if (ci.coterm) {
    var mths = Math.round((ci.days / 365) * 12 * 10) / 10;
    bits.push('<span class="badge coterm" title="Co-termed: this term runs ' + ci.days +
      ' days (' + mths + ' months), aligned to the customer&#39;s other subscriptions and billing on their shared contract. ' +
      (l.billing_type === 'annual_upfront'
        ? 'The upfront charge is pro-rated to ' + (ci.factor * 100).toFixed(1) + '% of the annual price, as Dicker invoices it.'
        : 'The monthly rate is unchanged — there are simply fewer charges before it renews for a full year.') +
      '">co-term ' + mths + ' mo</span>');
    bits.push('<span title="This subscription&#39;s own term">' +
      escapeHtml(shortDateIso(win.start)) + ' &rarr; ' + escapeHtml(longDateIso(win.end)) + '</span>');
  }
  var firstStarted = /^\d{4}-\d{2}-\d{2}$/.test(String(l.usage_start || '')) ? String(l.usage_start) : '';
  var subTitle = 'Subscription ' + (l.subscription_id || '') +
    (firstStarted ? ' · first started ' + firstStarted : '') +
    (win.start ? ' · current term ' + win.start + ' to ' + win.end : '');

  // The full Dicker STOCK DESCRIPTION, which is what the Autotask service is
  // named after. REFERENCE (offer_name) is only a fallback: Dicker truncates
  // it at 30 characters, so a renamed product arrives as "DO NOT USE -
  // Microsoft Defende".
  var nm = productName(l);
  var cut = !l.stock_description && nm.length >= 30;

  var due = dueNow(l);
  var pill;
  if (!on) {
    pill = '<span class="pill none">excluded</span>';
  } else if (!l.billing_last) {
    pill = '<span class="pill none" title="Run a sync to read Autotask billing state">not checked yet</span>';
  } else {
    var n = pendingCount(l);
    if (n > 0) {
      pill = '<button class="pill due js-bill" data-i="' + i + '"><span class="tick">&#9679;</span>' +
        money(due) + (n > 1 ? ' <span class="n">' + n + ' items</span>' : '') + '</button>';
    } else if (lastPostedIso(l)) {
      pill = '<button class="pill clear js-bill" data-i="' + i + '"><span class="tick">&#10003;</span>posted</button>';
    } else {
      pill = '<button class="pill none js-bill" style="cursor:pointer" data-i="' + i + '" ' +
        'title="This subscription has no charges in the CSP report and nothing posted in Autotask yet">nothing to bill</button>';
    }
  }

  // Beside the pill: where this service is in Autotask's billing lifecycle.
  // A charge is raised, then approved & posted, then pulled onto a customer
  // invoice, and those are three different places to be:
  //
  //   NOT APPROVED      something is sitting in Approve & Post right now. This
  //                     is about the CURRENT import, so it agrees with the
  //                     amount in the pill instead of contradicting it.
  //   APPROVED & POSTED posted, but not yet on a customer invoice.
  //   INVOICED          on an invoice - the drawer names it and links to it.
  //
  // The last two describe the LAST POSTED charge, so they are only shown once
  // nothing is waiting; while a cycle is pending, what the previous one did is
  // history and lives in the drawer. A line that has never been posted and has
  // nothing waiting has no lifecycle to report, so it gets no tag.
  var itag = '';
  if (on && pendingCount(l) > 0) {
    itag = '<span class="itag wait" title="' + attr(money(due) +
      ' is waiting in Autotask’s Approve & Post screen for this service.') +
      '">not approved</span>';
  } else if (on && lastPostedIso(l)) {
    var when = longDateIso(l.billing_last_date || lastPostedIso(l));
    if (isInvoiced(l)) {
      itag = '<span class="itag yes" title="' + attr('The charge posted on ' + when +
        ' is on invoice ' + invoiceRef(l) +
        (l.billing_last_invoice_date ? ' of ' + longDateIso(l.billing_last_invoice_date) : '') +
        '. Open the row for the link.') + '">invoiced</span>';
    } else {
      itag = '<span class="itag no" title="' + attr('The charge posted on ' + when +
        ' has been approved & posted but is not on a customer invoice yet.') +
        '">approved &amp; posted</span>';
    }
  }

  var main = '<tr class="line' + (on ? '' : ' off') + '" data-i="' + i + '">' +
    '<td class="pick"><input type="checkbox" class="js-incl" data-i="' + i + '"' + (on ? ' checked' : '') +
      ' title="Include this line in the Autotask sync"></td>' +
    '<td><div class="svc" title="' + attr(subTitle + (cut
        ? ' — ' + nm + ' (Dicker truncates REFERENCE at 30 characters, and this row has no stock description)'
        : '')) + '">' +
      escapeHtml(nm) + (cut ? '<span class="muted">…</span>' : '') + '</div>' +
      (bits.length
        ? '<div class="svcsub">' + bits.join('<span class="dot">·</span>') + '</div>'
        : '') +
      invoiceHtml(l, i) + '</td>' +
    '<td class="num">' + escapeHtml(String(l.qty || 0)) + '</td>' +
    '<td class="num muted">' + fmt(periodCost(l)) + '<span class="per">' + suffix + '</span></td>' +
    '<td class="num muted">' + fmt(periodRrp(l)) + '<span class="per">' + suffix + '</span></td>' +
    '<td class="num sell' + (l.use_custom_price ? ' editing' : '') + '" data-i="' + i + '">' +
      '<div class="sellview">' +
        '<button class="amt js-edit' + (l.use_custom_price ? ' custom' : '') + '" data-i="' + i + '" ' +
          'title="Click to change the price Autotask charges for this service">' +
          fmt(effSell(l)) + '<span class="per">' + suffix + '</span></button>' +
      '</div>' +
      '<div class="selledit">' +
        '<input type="number" step="0.01" min="0" class="js-sell" data-i="' + i + '" value="' + fmt(effSell(l)) + '">' +
        '<div class="fromlbl">effective from</div>' +
        '<input type="date" class="js-date" data-i="' + i + '" value="' + attr(l.price_effective_date) + '">' +
        '<div class="picks"><a class="js-pick" data-i="' + i + '" data-p="post" title="The next Approve &amp; Post billing start">next post</a>' +
        ' <span class="dot">·</span> <a class="js-pick" data-i="' + i + '" data-p="start" title="The contract start date">contract start</a>' +
        ' <span class="dot">·</span> <a class="js-cancel" data-i="' + i + '" title="Leave the Autotask price as it is">keep current</a></div>' +
      '</div>' +
    '</td>' +
    '<td class="num">' + marginHtml(l, i) + '</td>' +
    '<td>' + changeHtml(l) + '</td>' +
    '<td><div class="billcell">' + pill + itag + '</div></td>' +
    '<td>' + syncHtml(l) + '</td>' +
  '</tr>';

  return main + detailHtml(l);
}

// Shown under every service: what appears on the customer's invoice line.
// Click it to type your own; the next sync pushes it to Autotask.
function invoiceHtml(l, i) {
  var d = invoiceDesc(l);
  var hint = d.state === 'custom'
    ? 'Your wording - the next sync will set this in Autotask. Click to change.'
    : (d.state === 'live'
      ? 'What Autotask shows on the invoice line today. Click to change it.'
      : 'No contract service yet - this is what the first sync will set. Click to change it.');
  return '<div class="inv"><span class="lbl">Invoice' + (d.state === 'default' ? ' (unset)' : '') + '</span>' +
      '<button class="invtext ' + d.state + ' js-invedit" data-i="' + i + '" ' +
        'title="' + attr(d.text + ' — ' + hint) + '">' + escapeHtml(d.text) +
      '</button></div>' +
    '<div class="invedit">' +
      '<input type="text" maxlength="100" class="js-invtext" data-i="' + i + '" ' +
        'value="' + attr(customInvoiceDesc(l) || d.text) + '" ' +
        'placeholder="' + attr(defaultInvoiceDesc(l)) + '">' +
      '<span class="count" data-invcount="' + i + '"></span>' +
      '<button class="btn link js-invdone" data-i="' + i + '">done</button>' +
      '<button class="btn link js-invreset" data-i="' + i + '" ' +
        'title="Drop your wording and go back to the generated description">reset</button>' +
    '</div>';
}

// The Change cell. An excluded line is not being billed at all, so it has
// nothing to say about this cycle and gets an empty cell rather than a chip.
function changeHtml(l) {
  var c = cycleChange(l);
  if (!c) return '';
  return '<span class="chg ' + c.kind + '" title="' + attr(c.hint) + '">' +
    escapeHtml(c.label) + '</span>';
}

function marginClass(m) {
  if (m === null) return '';
  if (m < 0) return 'neg';
  return m < 10 ? 'thin' : '';
}
function marginHtml(l, i) {
  var m = marginPct(l);
  return '<span class="marg ' + marginClass(m) + '" data-marg="' + i + '"' +
    (m !== null && m < 10 ? ' title="Thin margin — cost ' + fmt(periodCost(l)) + ' against sell ' + fmt(effSell(l)) + '"' : '') +
    '>' + (m === null ? '—' : m.toFixed(1) + '%') + '</span>';
}
// A green "synced" badge on every healthy row is just noise; only the rows
// that need a human get a badge.
function syncHtml(l) {
  var st = String(l.sync_status || 'pending');
  var msg = l.sync_message ? String(l.sync_message).slice(0, 200) : '';
  if (st === 'synced') {
    return '<span class="ok-tick" title="Synced to Autotask' + (msg ? ' — ' + attr(msg) : '') + '">&#10003;</span>';
  }
  return '<span class="badge ' + escapeHtml(st) + '"' + (msg ? ' title="' + attr(msg) + '"' : '') +
    '>' + escapeHtml(st) + '</span>';
}

// The last charge Autotask has actually approved & posted for this service,
// read live from BillingItems, with the invoice it landed on if it has been
// invoiced since. The invoice number links straight into Autotask's invoice
// viewer - see INVOICE_URL at the top of this script.
function lastPostedHtml(l) {
  if (!l.billing_last_date) {
    return '<div class="dnone">Nothing has been approved &amp; posted for this service yet.</div>';
  }
  var rows = Number(l.billing_last_rows) || 1;
  var qty = Number(l.billing_last_qty) || 0;
  var inv = String(l.billing_last_invoice_number || '');
  var invId = String(l.billing_last_invoice_id || '');
  var line = '<div class="dline posted"><span class="when">' +
    escapeHtml(longDateIso(l.billing_last_date)) + '</span>' +
    '<span class="dtag">' + (inv || invId ? 'invoiced' : 'posted') + '</span>' +
    '<span class="muted">qty ' + escapeHtml(String(qty)) +
      (rows > 1 ? ' · ' + rows + ' items' : '') + '</span>' +
    '<span class="amt">' + money(l.billing_last_amount) + '</span></div>';
  var bits = [];
  if (l.billing_last_posted_on) bits.push('posted ' + longDateIso(l.billing_last_posted_on));
  if (inv || invId) {
    bits.push('invoice ' + invoiceLink(invId, inv) +
      (l.billing_last_invoice_date ? ' of ' + escapeHtml(longDateIso(l.billing_last_invoice_date)) : ''));
  } else {
    bits.push('not invoiced yet');
  }
  return line + '<div class="dfoot">' + bits.join(' · ') + '</div>';
}

// The breakdown behind the billing pill — hidden until asked for.
function detailHtml(l) {
  if (!effInclude(l) || !l.billing_last) return '';
  var items = pendingItems(l);
  var rows = items.map(function (x) {
    var when = longDateIso(x.s) + (x.e ? ' → ' + longDateIso(x.e) : '');
    var tag = x.type === 'cycle' ? 'cycle' : (x.type === 'pro-rata' ? 'prorata' : '');
    return '<div class="dline"><span class="when">' + escapeHtml(when) + '</span>' +
      '<span class="dtag ' + tag + '">' + escapeHtml(x.type) + '</span>' +
      '<span class="muted">qty ' + escapeHtml(String(x.q)) + '</span>' +
      '<span class="amt">' + money(x.amount) + '</span></div>';
  }).join('');
  var nothingPending = !items.filter(function (x) { return x.type !== 'next cycle'; }).length;
  var everPosted = !!lastPostedIso(l);
  var foot;
  if (!nothingPending) {
    foot = 'Estimated at the sell price on this screen.';
  } else if (everPosted) {
    foot = 'The whole CSP report is posted for this service — the line above is next cycle&#39;s estimate.';
  } else {
    foot = 'This subscription has no charges in the CSP report yet — the line above is what the first ' +
      'cycle is expected to bill.';
  }
  return '<tr class="detail" data-d="' + l._i + '"><td colspan="10"><div class="dpanel">' +
    '<div class="dsec">' + (nothingPending ? 'Next cycle (estimate)' : 'Waiting to be approved &amp; posted') + '</div>' +
    rows +
    '<div class="dfoot">' + foot + '</div>' +
    '<div class="dsec">Last approved &amp; posted</div>' +
    lastPostedHtml(l) +
    '</div></td></tr>';
}

// Documented Autotask deep link: opens the contract's Summary page in the
// ww31 zone (Approve & Post for its charges is one click from there).
function contractLink(contractId) {
  return '<a class="atlink" target="_blank" rel="noopener" onclick="event.stopPropagation()" ' +
    'href="https://ww31.autotask.net/Autotask/AutotaskExtend/ExecuteCommand.aspx?Code=OpenContract&amp;ContractID=' +
    encodeURIComponent(contractId) + '">Open #' + escapeHtml(String(contractId)) + ' &#8599;</a>';
}

// Labelled with the invoice NUMBER, because that is what appears on the
// customer's invoice and in Autotask's own lists; the internal id only ever
// goes in the URL. Without an internal id there is nothing to link to, so the
// number stays text however INVOICE_URL is set.
function invoiceLink(invoiceId, invoiceNumber) {
  var label = escapeHtml(String(invoiceNumber || invoiceId));
  if (!INVOICE_URL || !invoiceId) {
    return '<span class="inv-no" title="Open Billing &gt; Invoices in Autotask and ' +
      'search this number">' + label + '</span>';
  }
  var href = INVOICE_URL
    .replace('{id}', encodeURIComponent(String(invoiceId)))
    .replace('{number}', encodeURIComponent(String(invoiceNumber || '')));
  return '<a class="atlink" target="_blank" rel="noopener" onclick="event.stopPropagation()" ' +
    'href="' + attr(href) + '" title="Open invoice ' + attr(label) + ' in Autotask">' +
    label + ' &#8599;</a>';
}

function mapperHtml(tenantName) {
  return '<span class="map-box" onclick="event.stopPropagation()">' +
    '<input type="text" class="js-map" data-t="' + attr(tenantName) + '" placeholder="Search Autotask companies…">' +
    '<div class="map-results" style="display:none"></div></span>';
}

/* ============================================================
   Wiring — handlers are attached after each render.
   ============================================================ */
function wire() {
  each('.js-toggle', function (el) {
    el.onclick = function () {
      var k = el.getAttribute('data-key');
      UI.closed[k] = !UI.closed[k];
      if (!UI.closed[k]) delete UI.closed[k];
      persist();
      var sec = el.parentNode;
      sec.className = sec.className.replace(/ ?collapsed/, '') + (UI.closed[k] ? ' collapsed' : '');
    };
  });

  each('.js-incl', function (el) {
    el.onchange = function () {
      var l = LINES[+el.getAttribute('data-i')];
      l.include = el.checked;
      var tr = el.parentNode.parentNode;
      tr.className = 'line' + (el.checked ? '' : ' off');
      renderStats(LINES.filter(matches));
    };
  });

  each('.js-bill', function (el) {
    el.onclick = function () {
      var d = document.querySelector('tr.detail[data-d="' + el.getAttribute('data-i') + '"]');
      if (d) d.className = d.className.indexOf('open') >= 0 ? 'detail' : 'detail open';
    };
  });

  each('.js-edit', function (el) {
    el.onclick = function () { setEditing(+el.getAttribute('data-i'), true); };
  });
  each('.js-cancel', function (el) {
    el.onclick = function () { setEditing(+el.getAttribute('data-i'), false); };
  });
  each('.js-sell', function (el) {
    el.onchange = function () {
      var l = LINES[+el.getAttribute('data-i')];
      l.sell_price = Number(el.value);
      refreshLine(l);
    };
  });
  each('.js-date', function (el) {
    el.onchange = function () { LINES[+el.getAttribute('data-i')].price_effective_date = el.value; };
  });
  each('.js-pick', function (el) {
    el.onclick = function () {
      var l = LINES[+el.getAttribute('data-i')];
      var d;
      if (el.getAttribute('data-p') === 'start') {
        d = groupContract(l).start;
      } else {
        var items = pendingItems(l), hit = '';
        for (var i = 0; i < items.length; i++) {
          if (items[i].type === 'cycle' || items[i].type === 'next cycle') { hit = items[i].s; break; }
        }
        d = hit || (items.length ? items[0].s : '');
      }
      if (!d) return;
      l.price_effective_date = d;
      var input = document.querySelector('.js-date[data-i="' + l._i + '"]');
      if (input) input.value = d;
    };
  });

  each('.js-invedit', function (el) {
    el.onclick = function () { setInvEditing(+el.getAttribute('data-i'), true); };
  });
  each('.js-invdone', function (el) {
    el.onclick = function () { setInvEditing(+el.getAttribute('data-i'), false); };
  });
  each('.js-invreset', function (el) {
    el.onclick = function () {
      var i = +el.getAttribute('data-i');
      LINES[i].invoice_description = '';
      var input = document.querySelector('.js-invtext[data-i="' + i + '"]');
      if (input) input.value = defaultInvoiceDesc(LINES[i]);
      setInvEditing(i, false);
    };
  });
  each('.js-invtext', function (el) {
    var i = +el.getAttribute('data-i');
    var count = function () {
      var c = document.querySelector('[data-invcount="' + i + '"]');
      if (c) c.textContent = el.value.length + '/100';
    };
    var edited = function () {
      var l = LINES[i];
      var v = el.value.trim();
      // An override only means "different from what Autotask would otherwise
      // show" - typing back the live text or the generated default clears it.
      // Only a real edit assigns; the initial value never does, or every line
      // whose Autotask wording differs from the default would look overridden.
      l.invoice_description = (v === defaultInvoiceDesc(l) || v === liveInvoiceDesc(l)) ? '' : v;
      count();
    };
    el.oninput = edited;
    el.onchange = edited;
    count();
  });

  each('.js-map', function (el) { wireMapper(el); });
}

function setInvEditing(i, on) {
  var cell = document.querySelector('tr.line[data-i="' + i + '"] td:nth-child(2)');
  if (cell) cell.className = on ? 'inv-open' : '';
  var input = document.querySelector('.js-invtext[data-i="' + i + '"]');
  if (on && input) { input.focus(); input.select(); }
  if (!on) refreshInvoice(LINES[i]);
}

function refreshInvoice(l) {
  var d = invoiceDesc(l);
  var btn = document.querySelector('.js-invedit[data-i="' + l._i + '"]');
  if (!btn) return;
  btn.className = 'invtext ' + d.state + ' js-invedit';
  btn.textContent = d.text;
  var lbl = btn.parentNode.firstChild;
  if (lbl) lbl.textContent = 'Invoice' + (d.state === 'default' ? ' (unset)' : '');
}

function setEditing(i, on) {
  var l = LINES[i];
  l.use_custom_price = on;
  if (!on) {
    // Unticking does NOT change anything in Autotask: the contract keeps its
    // current price, which is what we show.
    l.sell_price = null;
    l.price_effective_date = TODAY;
    var d = document.querySelector('.js-date[data-i="' + i + '"]');
    if (d) d.value = TODAY;
  }
  var cell = document.querySelector('td.sell[data-i="' + i + '"]');
  if (cell) cell.className = 'num sell' + (on ? ' editing' : '');
  var input = document.querySelector('.js-sell[data-i="' + i + '"]');
  if (input) { input.value = fmt(effSell(l)); if (on) { input.focus(); input.select(); } }
  refreshLine(l);
}

function refreshLine(l) {
  var m = marginPct(l);
  var el = document.querySelector('[data-marg="' + l._i + '"]');
  if (el) {
    el.className = 'marg ' + marginClass(m);
    el.textContent = m === null ? '—' : m.toFixed(1) + '%';
  }
  var view = document.querySelector('td.sell[data-i="' + l._i + '"] .sellview .amt');
  if (view) {
    view.className = 'amt js-edit' + (l.use_custom_price ? ' custom' : '');
    view.innerHTML = fmt(effSell(l)) + '<span class="per">' + periodSuffix(l) + '</span>';
  }
  renderStats(LINES.filter(matches));
}

function wireMapper(input) {
  var results = input.nextSibling;
  var tenantName = input.getAttribute('data-t');
  var timer;
  input.oninput = function () {
    clearTimeout(timer);
    var q = input.value.trim();
    if (q.length < 2) { results.style.display = 'none'; return; }
    timer = setTimeout(function () {
      fetch(BASE + '/csp-pricing-companies?q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (list) {
          results.innerHTML = '';
          (list.companies || []).forEach(function (c) {
            var el = document.createElement('div');
            el.textContent = c.name + ' (#' + c.id + ')';
            el.onclick = function () { saveMapping(tenantName, c); };
            results.appendChild(el);
          });
          if (!(list.companies || []).length) results.innerHTML = '<div class="muted">No matches</div>';
          results.style.display = 'block';
        })
        .catch(function (e) {
          results.innerHTML = '<div class="muted">' + escapeHtml(e.message) + '</div>';
          results.style.display = 'block';
        });
    }, 350);
  };
}

function saveMapping(tenantName, company) {
  fetch(BASE + '/csp-pricing-mapping', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_name: tenantName, autotask_company_id: company.id, autotask_company_name: company.name })
  }).then(function () { location.reload(); });
}

/* ============================================================
   Filters, save, sync
   ============================================================ */
function setAll(open) {
  if (open) { UI.closed = {}; }
  else {
    UI.closed = {};
    LINES.forEach(function (l) {
      UI.closed['c:' + l.tenant_name] = true;
      var n = groupContract(l).name;
      UI.closed['k:' + l.tenant_name + '|' + n] = true;
    });
  }
  persist();
  render();
}

var qTimer;
document.getElementById('q').oninput = function () {
  var el = this;
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    UI.q = el.value.trim().toLowerCase();
    render();
    el.focus();
  }, 180);
};
document.getElementById('onlyDue').onchange = function () { UI.onlyDue = this.checked; render(); };
document.getElementById('onlyOff').checked = true;
document.getElementById('onlyOff').onchange = function () { UI.showOff = this.checked; render(); };

function savePayload() {
  return LINES.map(function (l) {
    return {
      subscription_id: l.subscription_id, stock_code: l.stock_code,
      use_custom_price: !!l.use_custom_price,
      sell_price: l.use_custom_price ? Number(l.sell_price !== null && l.sell_price !== undefined ? l.sell_price : periodRrp(l)) : null,
      include: effInclude(l),
      price_effective_date: l.price_effective_date || '',
      invoice_description: customInvoiceDesc(l)
    };
  });
}

function doSave() {
  return fetch(BASE + '/csp-pricing-save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines: savePayload() })
  }).then(function (r) { return r.json(); });
}

// How many lines are carrying wording of your own, so a save visibly
// accounts for them rather than just reporting a row count.
function customDescCount() {
  return LINES.filter(function (l) { return customInvoiceDesc(l); }).length;
}
function savedMsg(res) {
  var n = customDescCount();
  return 'Saved ' + (res.updated || 0) + ' lines' +
    (n ? ', ' + n + ' with your own invoice description' : '') + '.';
}

function saveAll(btn) {
  btn.disabled = true;
  setMsg('Saving…');
  doSave()
    .then(function (res) { setMsg(savedMsg(res)); btn.disabled = false; })
    .catch(function (e) { setMsg('Save failed: ' + e.message); btn.disabled = false; });
}

// Sync ALWAYS saves the on-screen prices first, so what you see is what
// gets pushed to Autotask.
function syncNow(btn) {
  if (!confirm('Push included lines to Autotask now?\n\nPrices on screen are saved automatically, then contracts and services are created/updated.')) return;
  btn.disabled = true;
  setMsg('Saving prices…');
  doSave()
    .then(function (res) {
      setMsg(savedMsg(res) + ' Starting sync…');
      return fetch(BASE + '/csp-autotask-sync', { method: 'POST' });
    })
    .then(function () { setMsg('Sync running — ~2–3 minutes. Refresh after that to see results.'); btn.disabled = false; })
    .catch(function (e) { setMsg('Sync could not start: ' + e.message); btn.disabled = false; });
}

function setMsg(t) { document.getElementById('msg').textContent = t; }
function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
// escapeHtml leaves double quotes alone, which is fine for text but breaks
// out of a quoted attribute. Anything going into an attribute uses this.
function attr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

render();
</script>
</body>
</html>
