<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantanna CSP Pricing Portal</title>
<style>
  :root {
    --bg:#f4f6f9; --card:#fff; --ink:#182233; --muted:#6b7686; --line:#e3e8ef;
    --brand:#0b5fff; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#10233f; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px 24px 60px; }
  .customer { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:22px; overflow:hidden; }
  .customer > .head { padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#f8fafc; }
  .customer h2 { font-size:15px; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fbfcfe; }
  tr:last-child td { border-bottom:none; }
  .num { text-align:right; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; background:var(--line); }
  .badge.synced { background:#dcfce7; color:var(--ok); }
  .badge.pending { background:#e0e7ff; color:#3730a3; }
  .badge.needs_mapping,.badge.partial { background:#fef3c7; color:var(--warn); }
  .badge.error { background:#fee2e2; color:var(--err); }
  .badge.unmapped { background:#fee2e2; color:var(--err); }
  .badge.coterm { background:#ede9fe; color:#5b21b6; margin-left:4px; cursor:help; }
  input[type=number] { width:92px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; text-align:right; }
  input[type=number]:disabled { background:#f1f5f9; color:var(--muted); }
  input[type=text] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; width:260px; }
  input[type=date] { padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; width:135px; }
  input[type=date]:disabled { background:#f1f5f9; color:var(--muted); }
  .btn { padding:8px 16px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; font-size:13.5px; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.sync { background:#15803d; border-color:#15803d; color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  .toolbar { position:sticky; top:0; z-index:10; background:var(--bg); padding:12px 0; display:flex; gap:10px; align-items:center; }
  .toolbar .msg { color:var(--muted); font-size:13px; }
  .toolbar a.btn { text-decoration:none; color:var(--ink); }
  .map-box { position:relative; }
  .map-results { position:absolute; top:100%; left:0; width:320px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.12); z-index:20; max-height:240px; overflow:auto; }
  .map-results div { padding:7px 10px; cursor:pointer; font-size:13px; }
  .map-results div:hover { background:#eef2f7; }
  .margin-pos { color:var(--ok); }
  .margin-neg { color:var(--err); }
  .muted { color:var(--muted); }
  .small { font-size:11.5px; }
  tr.mainrow td { border-bottom:none; }
  tr.subrow td { padding:0 10px 10px; font-size:11.5px; background:transparent; }
  .pend { border-left:3px solid #f59e0b; background:#fffbeb; border-radius:6px; padding:7px 12px; }
  .pend.allposted { border-left-color:#16a34a; background:#f0fdf4; }
  .pend.nodata { border-left-color:var(--line); background:#f8fafc; }
  .pend-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pend-title { font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#92400e; }
  .pend.allposted .pend-title { color:var(--ok); }
  .pend.nodata .pend-title { color:var(--muted); }
  .pend-total { font-weight:600; }
  .pend-item { display:block; padding:1.5px 0 0; }
  .pend-item .mono { color:var(--ink); }
  .atlink { margin-left:auto; font-weight:600; color:var(--brand); text-decoration:none; white-space:nowrap; }
  .atlink:hover { text-decoration:underline; }
  .datepicks { font-size:10.5px; margin-top:2px; white-space:nowrap; color:var(--muted); }
  .datepicks a { color:var(--brand); text-decoration:none; cursor:pointer; }
  .datepicks a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>Kantanna &middot; Dicker CSP &rarr; Autotask Pricing Portal</h1>
  <span id="meta" class="small" style="color:#cdd9ee"></span>
</header>
<div class="wrap">
  <div class="toolbar">
    <button class="btn primary" onclick="saveAll(this)">Save prices</button>
    <button class="btn sync" onclick="syncNow(this)">Sync to Autotask</button>
    <button class="btn" onclick="location.reload()">Refresh</button>
    <a class="btn" href="https://ww31.autotask.net/" target="_blank" rel="noopener" title="Approve &amp; Post lives under Contracts &gt; Approve &amp; Post">Autotask ↗</a>
    <span class="msg" id="msg"></span>
  </div>
  <div id="app"></div>
</div>

<script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
<script>
var BASE = location.pathname.replace(/\/csp-pricing.*$/, '');
var DATA = JSON.parse(atob(document.getElementById('__data').textContent));
var LINES = DATA.lines || [];
var MAPPINGS = {};
(DATA.mappings || []).forEach(function (m) { MAPPINGS[(m.tenant_name || '').toLowerCase()] = m; });

function fmt(n) { return (Number(n) || 0).toFixed(2); }
function fullPeriodRrp(l) { return Number(l.period_rrp !== null && l.period_rrp !== undefined ? l.period_rrp : l.monthly_rrp) || 0; }
function fullPeriodCost(l) { return Number(l.period_cost !== null && l.period_cost !== undefined ? l.period_cost : l.monthly_cost) || 0; }
// Co-terming: Microsoft aligns a new annual subscription to an existing
// anniversary, so its CURRENT term is shorter than 12 months while Dicker
// still lists the full 12-month unit price. Billed monthly that changes
// nothing (the monthly rate is the monthly rate, there are just fewer of
// them); billed annually UPFRONT the single charge is pro-rated on days,
// exactly as Dicker invoices it.
function cotermInfo(l) {
  var w = contractWindow(l);
  var months = Number(l.term_months) || 12;
  if (months !== 12 || !w.start || !w.end) return { days: 0, factor: 1, coterm: false };
  var a = new Date(w.start + 'T00:00:00Z'), b = new Date(w.end + 'T00:00:00Z');
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return { days: 0, factor: 1, coterm: false };
  var days = Math.round((b - a) / 86400000) + 1;
  if (days <= 0) return { days: 0, factor: 1, coterm: false };
  var factor = Math.min(Math.round((days / 365) * 10000) / 10000, 1);
  return { days: days, factor: factor, coterm: factor < 0.99 };
}
function termScale(l) {
  var ci = cotermInfo(l);
  return ci.coterm && l.billing_type === 'annual_upfront' ? ci.factor : 1;
}
function periodRrp(l) { return Math.round(fullPeriodRrp(l) * termScale(l) * 100) / 100; }
function periodCost(l) { return Math.round(fullPeriodCost(l) * termScale(l) * 100) / 100; }
function periodSuffix(l) { return l.billing_months === 12 ? '/yr' : '/mo'; }
function billingLabel(l) {
  if (l.billing_type === 'annual_upfront') return 'Annual · Upfront';
  if (l.billing_type === 'annual_monthly') return 'Annual · Monthly';
  if (l.billing_type === 'usage') return 'Usage';
  return 'Month to Month';
}
// The line's CURRENT contract price (read back from Autotask on the last
// sync); RRP only as the default for lines with no contract service yet.
function currentPrice(l) {
  return (l.contract_price !== null && l.contract_price !== undefined && l.contract_price !== '')
    ? Number(l.contract_price) : periodRrp(l);
}
function effSell(l) {
  return (l.use_custom_price && l.sell_price !== null && l.sell_price !== undefined && l.sell_price !== '')
    ? Number(l.sell_price) : currentPrice(l);
}
function effInclude(l) {
  if (l.include === false) return false;
  if (l.include === true) return true;
  // $0 lines (e.g. Teams Phone Resource accounts) are included too and
  // simply sync at a $0 sell price.
  return l.charge_type === 'NCE' && l.status === 'Active';
}
// Calendar-safe month arithmetic: clamp to the last day of the target
// month rather than overflowing (31-MAR minus a month is 28-FEB).
function addMonthsIso(iso, months) {
  var d = new Date(iso + 'T00:00:00Z');
  if (isNaN(d.getTime())) return '';
  var day = d.getUTCDate();
  d.setUTCDate(1);
  d.setUTCMonth(d.getUTCMonth() + months);
  var last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d.toISOString().slice(0, 10);
}
function addDaysIso(iso, days) {
  var d = new Date(iso + 'T00:00:00Z');
  if (isNaN(d.getTime())) return '';
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
// Same contract-window derivation as the sync (Prepare Lines). REVALUATION
// PERIOD is the subscription's current expiry; the term is inferred back
// from it by subscription type. The invoice report's TERM START is more
// precise for the same term (co-termed subscriptions), but once REVALUATION
// PERIOD is past the invoiced TERM END the subscription has renewed / rolled
// to the next cycle. START USAGE is the ORIGINAL start and is never used.
function contractWindow(l) {
  var ok = function (v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : ''; };
  var max = function (a, b) { return a && b ? (a > b ? a : b) : (a || b); };
  var months = Number(l.term_months) || 12;
  var invStart = ok(l.term_start), invEnd = ok(l.term_end), reval = ok(l.revaluation_period);
  var inferred = reval ? addMonthsIso(addDaysIso(reval, 1), -months) : '';
  var start = '', end = '';
  if (reval && invEnd && reval > invEnd) {
    start = max(addDaysIso(invEnd, 1), inferred); end = reval;
  } else if (invStart && invEnd) {
    start = invStart; end = max(invEnd, reval);
  } else if (reval) {
    // No invoice row this month: START USAGE (the day before the original
    // term began) raises the inferred start for co-termed subscriptions.
    var su = ok(l.usage_start);
    start = max(inferred, su ? addDaysIso(su, 1) : '');
    end = reval;
    if (start > end) start = inferred;
  }
  if (!start) start = invStart;
  if (!end && start) end = addMonthsIso(start, months);
  return { start: start, end: end };
}
// Earliest USAGE START among the invoice lines the sync replays as unit
// adjustments; the contract has to reach back that far.
function earliestUsageIso(l) {
  var inv = [];
  try { inv = JSON.parse(l.invoice_lines || '[]'); } catch (e) { return ''; }
  var first = '';
  for (var i = 0; i < inv.length; i++) {
    var s = String((inv[i] && inv[i].s) || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(s) && (!first || s < first)) first = s;
  }
  return first;
}
var MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function longDateIso(iso) {
  var d = new Date(iso + 'T00:00:00Z');
  if (isNaN(d.getTime())) return String(iso || '');
  return d.getUTCDate() + ' ' + MONTH_ABBR[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
var BILLING_SHORT = { annual_monthly: 'Annual Commit Monthly', annual_upfront: 'Annual Commit Yearly',
  monthly: 'Month to Month', usage: 'Usage' };
// The Autotask contract belongs to the CO-TERM GROUP, not the subscription:
// one per customer + billing type + anniversary. Autotask steps its billing
// periods from the contract start date, and Dicker bills every co-termed
// subscription on the group's anchor day, so they have to be the same date.
// Mirrors the same derivation as the sync (Prepare Lines).
function groupContract(l) {
  var w = contractWindow(l);
  var months = Number(l.term_months) || 12;
  var end = w.end;
  if (!end) return { name: '', start: '', end: '' };
  var start = addMonthsIso(addDaysIso(end, 1), -months);
  var d = new Date(start + 'T00:00:00Z');
  // Annual contracts are named for their term (so a renewal is a new
  // contract); month-to-month rolls forever and carries only its billing
  // anchor day, which says which cycle the subscription sits on.
  var anchor = isNaN(d.getTime()) ? start
    : (months === 12 ? longDateIso(start) + ' to ' + longDateIso(end) : 'day ' + d.getUTCDate());
  var short = BILLING_SHORT[l.billing_type] || 'Month to Month';
  var firstUsage = earliestUsageIso(l);
  if (firstUsage && firstUsage < start) start = firstUsage;
  return { name: 'CSP - ' + short + ' - ' + anchor, start: start, end: end };
}
function marginPct(l) {
  var s = effSell(l), c = periodCost(l);
  if (!s) return null;
  return ((s - c) / s) * 100;
}

function render() {
  var byCustomer = {};
  LINES.forEach(function (l) { (byCustomer[l.tenant_name] = byCustomer[l.tenant_name] || []).push(l); });
  var names = Object.keys(byCustomer).sort();
  var app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('meta').textContent = LINES.length + ' subscription lines · ' +
    names.length + ' customers' + (LINES[0] && LINES[0].imported_at ? ' · imported ' + String(LINES[0].imported_at).slice(0, 10) : '');

  if (!names.length) {
    app.innerHTML = '<p class="muted">No subscription lines yet. Run the "01 · Annuity Import" workflow form first.</p>';
    return;
  }

  names.forEach(function (name) {
    var mapping = MAPPINGS[name.toLowerCase()];
    var card = document.createElement('div');
    card.className = 'customer';

    var head = document.createElement('div');
    head.className = 'head';
    var h2 = document.createElement('h2');
    h2.textContent = name;
    head.appendChild(h2);

    if (mapping) {
      var ok = document.createElement('span');
      ok.className = 'badge synced';
      ok.textContent = 'Autotask: ' + mapping.autotask_company_name + ' (#' + mapping.autotask_company_id + ')';
      head.appendChild(ok);
    } else {
      var bad = document.createElement('span');
      bad.className = 'badge unmapped';
      bad.textContent = 'not mapped';
      head.appendChild(bad);
      head.appendChild(buildMapper(name));
    }
    card.appendChild(head);

    var table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Incl.</th><th>Offer</th><th>Billing</th>' +
      '<th title="The Autotask contract this line bills on. Every subscription co-termed to the same anniversary shares one contract, so they Approve &amp; Post together.">Contract</th>' +
      '<th>Subscription ID</th>' +
      '<th title="Start of the CURRENT term (month-to-month: the current billing cycle). Hover the date for when the subscription first started.">Start</th>' +
      '<th title="End of the current term — the annuity report&#39;s REVALUATION PERIOD. Renewals extend the Autotask contract to this date.">End</th>' +
      '<th class="num">Qty</th><th class="num">Cost</th><th class="num">RRP</th>' +
      '<th title="Tick to change the contract price; unticked, the contract keeps its current price">Edit price</th><th class="num">Sell</th><th title="Date the price change takes effect in Autotask">From</th><th class="num">Margin</th><th>Status</th></tr></thead>';
    var tbody = document.createElement('tbody');
    // Order by the contract they share, so an Approve & Post run reads as
    // one block per contract rather than scattered lines.
    byCustomer[name].slice().sort(function (a, b) {
      var ga = groupContract(a).name, gb = groupContract(b).name;
      if (ga !== gb) return ga < gb ? -1 : 1;
      return String(a.offer_name || '').localeCompare(String(b.offer_name || ''));
    }).forEach(function (l) {
      tbody.appendChild(buildRow(l));
      tbody.appendChild(buildBillingRow(l));
    });
    table.appendChild(tbody);
    card.appendChild(table);
    app.appendChild(card);
  });
}

// Everything for this subscription that Autotask has NOT yet approved &
// posted: each pro-rata change from the CSP report plus the billing-cycle
// charge, valued at the sell price (pro-rata scaled by the same day
// fraction Dicker used: window unit cost / full-period unit cost). What is
// already posted (per the last sync's BillingItems check) is dropped; when
// the whole report is posted, the NEXT cycle's charge is shown instead.
function pendingItems(l) {
  var sell = effSell(l);
  var perUnitCost = Number(l.period_cost) || 0;
  var inv = [];
  try { inv = JSON.parse(l.invoice_lines || '[]'); } catch (e) {}
  inv = inv.filter(function (x) { return x && x.s; })
    .sort(function (a, b) { return String(a.s).localeCompare(String(b.s)); });
  var m = String(l.billing_last || '').match(/^\d{4}-\d{2}-\d{2}/);
  var lastPosted = m ? m[0] : null;

  var cycleEnd = '';
  inv.forEach(function (x) { if (String(x.e || '') > cycleEnd) cycleEnd = String(x.e || ''); });
  var cycleStart = '';
  inv.forEach(function (x) {
    if (String(x.e || '') === cycleEnd && (!cycleStart || String(x.s) < cycleStart)) cycleStart = String(x.s);
  });

  var items = [];
  inv.forEach(function (x) {
    if (lastPosted && String(x.s) <= lastPosted) return; // covered by what's posted
    var isCycle = String(x.s) === cycleStart && String(x.e) === cycleEnd;
    var factor = perUnitCost > 0 ? Math.min(Number(x.u || 0) / perUnitCost, 1) : (isCycle ? 1 : 0);
    items.push({ s: String(x.s), e: String(x.e || ''), q: Number(x.q || 0),
      type: isCycle ? 'cycle' : 'pro-rata',
      amount: Math.round(Number(x.q || 0) * sell * factor * 100) / 100 });
  });
  if (!items.length) {
    var months = l.billing_months === 12 ? 12 : 1;
    var nextS = lastPosted ? addMonthsIso(lastPosted, months) : (cycleStart || groupContract(l).start || '');
    if (nextS) items.push({ s: nextS, e: '', q: Number(l.qty || 0), type: 'next cycle',
      amount: Math.round(Number(l.qty || 0) * sell * 100) / 100 });
  }
  return items;
}

// Documented Autotask deep link: opens the contract's Summary page in the
// ww31 zone (Approve & Post for its charges is one click from there).
function contractLink(l) {
  if (!l.autotask_contract_id) return '';
  return '<a class="atlink" target="_blank" rel="noopener" href="https://ww31.autotask.net/Autotask/AutotaskExtend/ExecuteCommand.aspx?Code=OpenContract&amp;ContractID=' +
    encodeURIComponent(l.autotask_contract_id) + '">Open contract in Autotask ↗</a>';
}

function buildBillingRow(l) {
  var tr = document.createElement('tr');
  tr.className = 'subrow';
  tr.appendChild(document.createElement('td'));
  var td1 = document.createElement('td');
  td1.colSpan = 14;

  var box = document.createElement('div');
  var lastTxt = l.billing_last || '';
  if (!effInclude(l)) {
    box.className = 'pend nodata';
    box.innerHTML = '<div class="pend-head"><span class="pend-title">Not synced</span>' +
      '<span class="muted">line excluded from Autotask</span></div>';
  } else if (!lastTxt) {
    box.className = 'pend nodata';
    box.innerHTML = '<div class="pend-head"><span class="pend-title">Billing not checked yet</span>' +
      '<span class="muted">run a sync to load Autotask billing state</span></div>';
  } else {
    var items = pendingItems(l);
    var pending = items.filter(function (i) { return i.type !== 'next cycle'; });
    var allPosted = pending.length === 0;
    box.className = 'pend' + (allPosted ? ' allposted' : '');
    var total = items.reduce(function (s, i) { return s + i.amount; }, 0);
    var head = '<div class="pend-head">' +
      '<span class="pend-title">' + (allPosted ? 'Report fully posted · next cycle' : 'Awaiting Approve &amp; Post') + '</span>' +
      '<span class="pend-total">$' + total.toFixed(2) + (items.length > 1 ? ' · ' + items.length + ' items' : '') + '</span>' +
      '<span class="muted">Last posted: ' + escapeHtml(lastTxt) + '</span>' +
      contractLink(l) +
      '</div>';
    var rows = items.map(function (i) {
      return '<span class="pend-item"><span class="mono">' + escapeHtml(i.s) +
        (i.e ? ' → ' + escapeHtml(i.e) : '') + '</span>' +
        ' · <span class="badge">' + escapeHtml(i.type) + '</span>' +
        ' · qty ' + escapeHtml(String(i.q)) +
        ' · est <b>$' + i.amount.toFixed(2) + '</b></span>';
    }).join('');
    box.innerHTML = head + rows;
  }
  td1.appendChild(box);
  tr.appendChild(td1);
  return tr;
}

function buildRow(l) {
  var tr = document.createElement('tr');
  tr.className = 'mainrow';

  var incl = document.createElement('input');
  incl.type = 'checkbox';
  incl.checked = effInclude(l);
  incl.onchange = function () { l.include = incl.checked; l._dirty = true; };
  tr.appendChild(td(incl));

  var offer = document.createElement('td');
  offer.innerHTML = escapeHtml(l.offer_name || '') +
    ' <span class="mono">' + escapeHtml(l.sku || '') + '</span>';
  tr.appendChild(offer);

  var billing = document.createElement('td');
  var ci = cotermInfo(l);
  var cotermBadge = '';
  if (ci.coterm) {
    var mths = Math.round((ci.days / 365) * 12 * 10) / 10;
    cotermBadge = '<span class="badge coterm" title="Co-termed: this term is ' + ci.days +
      ' days (' + mths + ' months), aligned to the customer&#39;s other subscriptions and billing on their shared contract. ' +
      (l.billing_type === 'annual_upfront'
        ? 'The upfront charge is pro-rated to ' + (ci.factor * 100).toFixed(1) + '% of the annual price, as Dicker invoices it.'
        : 'The monthly rate is unchanged - there are simply fewer charges before it renews for a full year.') +
      '">co-term ' + mths + 'mo</span>';
  }
  billing.innerHTML = '<span class="badge">' + escapeHtml(billingLabel(l)) + '</span>' + cotermBadge;
  tr.appendChild(billing);

  var grp = groupContract(l);
  var tdGroup = document.createElement('td');
  tdGroup.innerHTML = grp.name
    ? '<span class="small" title="' + escapeHtml('Contract runs ' + grp.start + ' to ' + grp.end +
        '. Autotask bills every service on it against this window.') + '">' + escapeHtml(grp.name) + '</span>' +
      (l.autotask_contract_id ? '<div class="mono small">#' + escapeHtml(String(l.autotask_contract_id)) + '</div>' : '')
    : '<span class="muted">—</span>';
  tr.appendChild(tdGroup);

  var sid = document.createElement('td');
  sid.innerHTML = '<span class="mono" title="' + escapeHtml(l.subscription_id) + '">' + escapeHtml(String(l.subscription_id).slice(0, 8)) + '…</span>';
  tr.appendChild(sid);

  var win = contractWindow(l);
  var tdStart = document.createElement('td');
  // START USAGE is the subscription's ORIGINAL start, not this term's, so
  // it is shown only as a tooltip alongside the derived current term.
  var firstStarted = /^\d{4}-\d{2}-\d{2}$/.test(String(l.usage_start || '')) ? String(l.usage_start) : '';
  var startTitle = 'Current term start' +
    (firstStarted && firstStarted !== win.start ? ' · first started ' + firstStarted : '');
  tdStart.innerHTML = win.start
    ? '<span class="mono" title="' + escapeHtml(startTitle) + '">' + escapeHtml(win.start) + '</span>'
    : '<span class="muted">—</span>';
  tr.appendChild(tdStart);
  var tdEnd = document.createElement('td');
  tdEnd.innerHTML = win.end ? '<span class="mono">' + escapeHtml(win.end) + '</span>' : '<span class="muted">—</span>';
  tr.appendChild(tdEnd);

  tr.appendChild(tdText(l.qty, 'num'));
  tr.appendChild(tdText(fmt(periodCost(l)) + periodSuffix(l), 'num'));
  tr.appendChild(tdText(fmt(periodRrp(l)) + periodSuffix(l), 'num'));

  var custom = document.createElement('input');
  custom.type = 'checkbox';
  custom.checked = !!l.use_custom_price;
  custom.title = 'Tick to change the contract price';
  tr.appendChild(td(custom));

  var sell = document.createElement('input');
  sell.type = 'number'; sell.step = '0.01'; sell.min = '0';
  sell.value = fmt(effSell(l));
  sell.disabled = !l.use_custom_price;
  sell.title = 'Sell price per billing period (' + periodSuffix(l).slice(1) + ')';
  tr.appendChild(td(sell, 'num'));

  var effDate = document.createElement('input');
  effDate.type = 'date';
  effDate.value = /^\d{4}-\d{2}-\d{2}$/.test(l.price_effective_date || '') ? l.price_effective_date : new Date().toISOString().slice(0, 10);
  effDate.title = 'Price/unit changes take effect in Autotask from this date';
  effDate.onchange = function () { l.price_effective_date = effDate.value; l._dirty = true; };
  l.price_effective_date = effDate.value;
  effDate.disabled = !l.use_custom_price;

  // Quick picks: the next Approve & Post billing start, or the contract start.
  var dateCell = document.createElement('td');
  dateCell.appendChild(effDate);
  var picks = document.createElement('div');
  picks.className = 'datepicks';
  function mkPick(label, getDate, titleTxt) {
    var a = document.createElement('a');
    a.textContent = label;
    a.title = titleTxt;
    a.onclick = function () {
      if (effDate.disabled) return;
      var d = getDate();
      if (!d) return;
      effDate.value = d; l.price_effective_date = d; l._dirty = true;
    };
    return a;
  }
  picks.appendChild(mkPick('next post', function () {
    var items = pendingItems(l);
    for (var i = 0; i < items.length; i++) {
      if (items[i].type === 'cycle' || items[i].type === 'next cycle') return items[i].s;
    }
    return items.length ? items[0].s : '';
  }, 'Set to the next Approve & Post billing start date'));
  picks.appendChild(document.createTextNode(' · '));
  picks.appendChild(mkPick('contract start', function () {
    return groupContract(l).start;
  }, 'Set to the contract start date'));
  dateCell.appendChild(picks);
  function updatePicks() {
    picks.style.opacity = effDate.disabled ? '.45' : '1';
    picks.style.pointerEvents = effDate.disabled ? 'none' : 'auto';
  }
  updatePicks();
  tr.appendChild(dateCell);

  var margin = document.createElement('td');
  margin.className = 'num';
  tr.appendChild(margin);

  function refreshMargin() {
    var m = marginPct(l);
    margin.innerHTML = m === null ? '<span class="muted">—</span>'
      : '<span class="' + (m >= 0 ? 'margin-pos' : 'margin-neg') + '">' + m.toFixed(1) + '%</span>';
  }
  refreshMargin();

  custom.onchange = function () {
    l.use_custom_price = custom.checked; l._dirty = true;
    if (!custom.checked) {
      // Unticking does NOT change anything in Autotask: the contract keeps
      // its current price, which is what we show.
      l.sell_price = null; sell.value = fmt(currentPrice(l)); sell.disabled = true;
      effDate.value = new Date().toISOString().slice(0, 10);
      l.price_effective_date = effDate.value;
      effDate.disabled = true;
    } else { sell.disabled = false; l.sell_price = Number(sell.value); effDate.disabled = false; sell.focus(); }
    updatePicks();
    refreshMargin();
  };
  sell.onchange = function () { l.sell_price = Number(sell.value); l._dirty = true; refreshMargin(); };

  var status = document.createElement('td');
  var badge = '<span class="badge ' + escapeHtml(l.sync_status || 'pending') + '">' + escapeHtml(l.sync_status || 'pending') + '</span>';
  var extra = '';
  if (l.sync_message) extra += '<div class="muted small">' + escapeHtml(String(l.sync_message).slice(0, 120)) + '</div>';
  status.innerHTML = badge + extra;
  tr.appendChild(status);

  return tr;
}

function buildMapper(tenantName) {
  var box = document.createElement('span');
  box.className = 'map-box';
  var input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Search Autotask companies…';
  var results = document.createElement('div');
  results.className = 'map-results';
  results.style.display = 'none';
  box.appendChild(input); box.appendChild(results);

  var timer;
  input.oninput = function () {
    clearTimeout(timer);
    var q = input.value.trim();
    if (q.length < 2) { results.style.display = 'none'; return; }
    timer = setTimeout(function () {
      fetch(BASE + '/csp-pricing-companies?q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (list) {
          results.innerHTML = '';
          (list.companies || []).forEach(function (c) {
            var el = document.createElement('div');
            el.textContent = c.name + ' (#' + c.id + ')';
            el.onclick = function () { saveMapping(tenantName, c); };
            results.appendChild(el);
          });
          if (!(list.companies || []).length) results.innerHTML = '<div class="muted">No matches</div>';
          results.style.display = 'block';
        })
        .catch(function (e) { results.innerHTML = '<div class="muted">' + escapeHtml(e.message) + '</div>'; results.style.display = 'block'; });
    }, 350);
  };
  return box;
}

function saveMapping(tenantName, company) {
  fetch(BASE + '/csp-pricing-mapping', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_name: tenantName, autotask_company_id: company.id, autotask_company_name: company.name })
  }).then(function () { location.reload(); });
}

function savePayload() {
  return LINES.map(function (l) {
    return {
      subscription_id: l.subscription_id, stock_code: l.stock_code,
      use_custom_price: !!l.use_custom_price,
      sell_price: l.use_custom_price ? Number(l.sell_price !== null && l.sell_price !== undefined ? l.sell_price : periodRrp(l)) : null,
      include: effInclude(l),
      price_effective_date: l.price_effective_date || ''
    };
  });
}

function doSave() {
  return fetch(BASE + '/csp-pricing-save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines: savePayload() })
  }).then(function (r) { return r.json(); });
}

function saveAll(btn) {
  btn.disabled = true;
  doSave()
    .then(function (res) { setMsg('Saved ' + (res.updated || 0) + ' lines.'); btn.disabled = false; })
    .catch(function (e) { setMsg('Save failed: ' + e.message); btn.disabled = false; });
}

// Sync ALWAYS saves the on-screen prices first, so what you see is what
// gets pushed to Autotask.
function syncNow(btn) {
  if (!confirm('Push included lines to Autotask now?\n\nPrices on screen are saved automatically, then contracts and services are created/updated.')) return;
  btn.disabled = true;
  setMsg('Saving prices…');
  doSave()
    .then(function (res) {
      setMsg('Saved ' + (res.updated || 0) + ' lines. Starting sync…');
      return fetch(BASE + '/csp-autotask-sync', { method: 'POST' });
    })
    .then(function () { setMsg('Sync running — takes ~2–3 minutes for all lines. Refresh after that to see results.'); btn.disabled = false; })
    .catch(function (e) { setMsg('Sync could not start: ' + e.message); btn.disabled = false; });
}

function setMsg(t) { document.getElementById('msg').textContent = t; }
function td(child, cls) { var c = document.createElement('td'); if (cls) c.className = cls; c.appendChild(child); return c; }
function tdText(t, cls) { var c = document.createElement('td'); if (cls) c.className = cls; c.textContent = t; return c; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

render();
</script>
</body>
</html>
