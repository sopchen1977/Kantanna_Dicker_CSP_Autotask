<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter your code &middot; CSP Pricing</title>
<style>
  :root {
    --bg:#f1f4f8; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
    --line:#e2e8f0; --brand:#2563eb; --bad:#b91c1c; --badbg:#fef2f2;
    --ok:#166534; --okbg:#f0fdf4;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid; place-items:center; padding:24px;
  }
  .card {
    width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:30px 30px 26px;
    box-shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 28px rgba(15,23,42,.08);
  }
  .logo {
    width:40px; height:40px; border-radius:10px; background:#0d1b30; color:#fff;
    display:grid; place-items:center; font-size:13px; font-weight:700;
    letter-spacing:.06em; margin-bottom:18px;
  }
  h1 { margin:0 0 6px; font-size:19px; font-weight:600; letter-spacing:-.015em; }
  .sub { margin:0 0 22px; font-size:13.5px; color:var(--muted); }
  .sub b { color:var(--ink2); font-weight:600; }
  label { display:block; font-size:12px; font-weight:600; color:var(--ink2);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  input[type=email], input[type=text] {
    width:100%; padding:10px 12px; font:inherit; font-size:14.5px;
    border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);
  }
  input:focus { outline:2px solid #bfdbfe; outline-offset:-1px; border-color:var(--brand); }
  /* The code is six digits and gets pasted out of an email - give it room
     and tabular figures so a transposed digit is easy to spot. */
  input.code {
    font-size:23px; letter-spacing:.34em; text-align:center; font-variant-numeric:tabular-nums;
    padding:12px; font-weight:600;
  }
  button {
    width:100%; margin-top:14px; padding:11px 16px; font:inherit; font-size:14.5px;
    font-weight:600; color:#fff; background:var(--brand); border:0; border-radius:9px;
    cursor:pointer;
  }
  button:hover { background:#1d4ed8; }
  .linkrow { margin-top:16px; font-size:13px; color:var(--muted); text-align:center; }
  .linkrow a, .linkrow button.link {
    color:var(--brand); text-decoration:none; cursor:pointer; background:none;
    border:0; padding:0; margin:0; width:auto; font:inherit; font-size:13px;
  }
  .linkrow a:hover, .linkrow button.link:hover { text-decoration:underline; background:none; }
  .msg { margin-top:14px; padding:9px 12px; border-radius:8px; font-size:13px; }
  .msg.bad { background:var(--badbg); color:var(--bad); border:1px solid #fecaca; }
  .msg.ok { background:var(--okbg); color:var(--ok); border:1px solid #bbf7d0; }
  .foot { margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<!--
  Step two. Like step one this is a real form POST so the top-level window
  navigates: the response to csp-auth-verify carries the session cookie, and
  only a first-party navigation gets to keep it under n8n Cloud's sandbox.
-->
<div class="card">
  <div class="logo">CSP</div>
  <h1>Enter your code</h1>
  <p class="sub">We sent a six-digit code to <b>__EMAIL__</b>. It expires in 10 minutes.</p>

  <form method="POST" action="csp-auth-verify">
    <label for="code">Sign-in code</label>
    <input id="code" class="code" name="code" type="text" inputmode="numeric"
           autocomplete="one-time-code" pattern="[0-9]*" maxlength="6"
           placeholder="000000" required autofocus>
    <input type="hidden" name="email" value="__EMAIL__">
    <input type="hidden" name="next" value="__NEXT__">
    <button type="submit">Sign in</button>
  </form>

  <div class="msg __KIND__">__MESSAGE__</div>

  <div class="linkrow">
    <form method="POST" action="csp-auth-request" style="display:inline">
      <input type="hidden" name="email" value="__EMAIL__">
      <input type="hidden" name="next" value="__NEXT__">
      <button type="submit" class="link">Send another code</button>
    </form>
    &middot; <a href="__NEXT__">Use a different address</a>
  </div>

  <p class="foot">
    Access is limited to kantanna.com, kantanna.com.au and kantanna.ph addresses.
    Signing in keeps you signed in on this browser for 14 days.
  </p>
</div>
</body>
</html>
